<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company profile</title>
<style>
  :root { --ink: #1c1c14; --paper: #f1f1ea; --muted: #6b6b5c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  header { display: flex; align-items: center; gap: 20px; padding: 20px 32px; border-bottom: 1px solid var(--ink); }
  .logo { width: 64px; height: 64px; border: 1px solid var(--ink); border-radius: 50%; display: flex;
    align-items: center; justify-content: center; overflow: hidden; background: #fff; flex: none;
    color: var(--muted); font-size: 11px; }
  .logo img { max-width: 80%; max-height: 80%; }
  h1 { margin: 0; font-size: 34px; }
  .tag { display: inline-block; border: 1px solid var(--ink); padding: 1px 8px; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; vertical-align: middle; margin-left: 10px; }
  .picker { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .picker input { font: inherit; padding: 6px 10px; border: 1px solid var(--ink); background: var(--paper); width: 260px; }
  .picker button { font: inherit; border: 1px solid var(--ink); background: var(--paper); padding: 6px 12px; cursor: pointer; }
  main { padding: 24px 32px; max-width: 1300px; }
  .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0 32px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .item { border: 1px solid var(--ink); padding: 6px 10px; background: #fff; }
  .rounds { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  .rounds th { text-align: left; font-weight: normal; }
  .rounds td, .rounds th { padding: 4px 8px 4px 0; }
  .rounds tr.main td { border-top: 1px solid var(--ink); padding-top: 8px; }
  .rounds tr.detail td { color: var(--muted); font-size: 12px; padding-bottom: 8px; }
  .summary { margin: 8px 0 0; font-size: 13px; }
  .flag { display: inline-block; margin-top: 8px; border: 1px solid #b42318; color: #b42318; background: #fdeceb;
    padding: 2px 8px; font-size: 12px; font-weight: 600; }
  .short .badge, .short .src, .short .srcpanel { font-family: system-ui, sans-serif; font-style: normal; }
  .short { font: italic 24px/1.35 Georgia, serif; margin: 6px 0 24px; }
  .box { border: 1px solid var(--ink); padding: 14px 16px; margin-bottom: 24px; }
  .facts { display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; margin: 8px 0 0; }
  .facts dt { align-self: center; }
  .facts dd { margin: 0; }
  .empty { color: var(--muted); }
  .val { display: inline-block; padding: 2px 8px; border: 1px solid transparent; }
  .val.uncertain { border: 1px dashed #b7791f; background: #fbf3df; }
  .val.notfound { border: 1px solid #b42318; color: #b42318; background: #fdeceb; }
  .val.notresearched { border: 2px solid #b42318; color: #b42318; background: transparent; }
  .badge { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 0 6px; margin-left: 6px; border: 1px solid var(--muted); color: var(--muted); vertical-align: middle; }
  .badge.est, .badge.low { border-color: #b7791f; color: #8a5a00; background: #fbf3df; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
  .dot.high { background: #2f9e44; } .dot.medium { background: #e6b800; } .dot.low { background: #d92d20; }
  .src { font: inherit; font-size: 11px; margin-left: 6px; padding: 0 6px; border: 1px solid var(--ink);
    background: var(--paper); cursor: pointer; vertical-align: middle; }
  .srcpanel { display: inline-flex; gap: 6px; align-items: center; margin-left: 6px; font-size: 12px; color: var(--muted); }
  .srcpanel[hidden] { display: none; }
  .srcpanel button { font: inherit; font-size: 11px; border: 1px solid var(--ink); background: #fff; padding: 0 6px; cursor: pointer; }
  .note { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .banner { border: 2px solid #b42318; color: #b42318; padding: 10px 16px; margin-bottom: 24px; font-weight: 600; }
  .legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .legend .badge { margin-left: 0; }
  header .legend { flex-basis: 100%; }
  header { flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <h1><span id="name"></span><span class="tag" id="status" hidden></span></h1>
  <div class="picker">
    <button id="prev" title="Previous company">&larr;</button>
    <input id="search" list="companies" placeholder="Search companies..." autocomplete="off">
    <datalist id="companies"></datalist>
    <button id="next" title="Next company">&rarr;</button>
  </div>
  <div class="legend">
    <span><span class="dot high" style="margin:0"></span> high</span>
    <span><span class="dot medium" style="margin:0"></span> medium</span>
    <span><span class="dot low" style="margin:0"></span> low confidence</span>
    <span><span class="val uncertain" style="padding:0 6px">value</span> uncertain: estimated or low</span>
    <span><span class="badge">reported</span> a Source states it</span>
    <span><span class="badge est">EST</span> estimated (we deduced it)</span>
    <span><span class="badge low">LOW</span> low confidence</span>
    <span><span class="val notfound" style="padding:0 6px">NOT FOUND</span> researched, nothing public</span>
    <span><span class="val notresearched" style="padding:0 6px">NOT RESEARCHED</span> not yet researched</span>
  </div>
</header>
<main id="profile"></main>
<script src="data.js"></script>
<script>
const data = window.PROFILE_DATA;
const profiles = data ? data.profiles : [];
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function claim(profile, field) {
  return profile.claims.find((row) => row.field === field);
}

function value(profile, field) {
  const c = claim(profile, field);
  return c ? c.value : "";
}

function copyText(text, button) {
  const done = () => { const old = button.textContent; button.textContent = "Copied"; setTimeout(() => (button.textContent = old), 1200); };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(done, () => { button.textContent = "Copy failed"; });
  else { const t = el("textarea", { value: text }); document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); done(); }
}

// Source button: reveals Open (new tab) and Copy; the URL itself is never printed.
function sourceButton(url) {
  if (!url) return document.createDocumentFragment();
  const wrap = el("span", {});
  const btn = el("button", { className: "src", type: "button", title: "Show source" }, "source");
  const panel = el("span", { className: "srcpanel", hidden: true },
    el("button", { type: "button", onclick: () => /^https?:\/\//i.test(url) && window.open(url, "_blank", "noopener") }, "Open"),
    el("button", { type: "button", onclick: (e) => copyText(url, e.target) }, "Copy"));
  btn.addEventListener("click", () => { panel.hidden = !panel.hidden; });
  wrap.append(btn, panel);
  return wrap;
}

// Evidence shown on any row-backed value: confidence dot, Basis, note, source button.
function evidence(row) {
  const uncertain = row.basis === "estimated" || row.confidence === "low";
  const out = [];
  if (row.confidence) out.push(el("span", { className: "dot " + row.confidence, title: row.confidence + " confidence" }));
  out.push(el("span", { className: "badge" }, row.basis || "no basis"));
  if (row.basis === "estimated") out.push(el("span", { className: "badge est" }, "EST"));
  if (row.confidence === "low") out.push(el("span", { className: "badge low" }, "LOW"));
  out.push(sourceButton(row.source_url));
  const note = row.note ? el("span", { className: "note" }, row.note) : "";
  return { uncertain, nodes: out, note };
}

const NONE_RECORDED = new Set(["acquirer", "acquisition_year"]);

// One classification for every field slot: reported / uncertain / not found / not researched.
function fieldView(profile, field, row, text) {
  if (row) {
    const ev = evidence(row);
    return el("span", {}, el("span", { className: "val" + (ev.uncertain ? " uncertain" : "") }, text ?? row.value),
      ...ev.nodes, ev.note);
  }
  if (NONE_RECORDED.has(field)) return el("span", { className: "val empty" }, "none recorded (not acquired, or not found)");
  if (profile.researched_on) {
    return el("span", { className: "val notfound" }, "NOT FOUND (as of " + profile.researched_on + ")");
  }
  return el("span", { className: "val notresearched" }, "NOT RESEARCHED");
}

function listBox(profile, title, field) {
  const rows = profile.claims.filter((r) => r.field === field);
  const stack = el("div", { className: "stack" });
  if (rows.length) {
    for (const row of rows) stack.append(el("div", { className: "item" }, fieldView(profile, field, row)));
  } else {
    stack.append(fieldView(profile, field));
  }
  return el("div", { className: "box" }, el("div", { className: "label" }, title), stack);
}

const usd = (n) => (n === "" || n == null ? "?" : "US$" + Number(n).toLocaleString("en-US"));
const roundLabel = (r) => (r ? r.type.replace(/_/g, " ") + " " + r.year : "none");

function roundsBox(profile) {
  const box = el("div", { className: "box" }, el("div", { className: "label" }, "Investment Rounds"));
  const rounds = profile.rounds;
  if (!rounds.length) {
    box.append(el("div", { className: "stack" }, fieldView(profile, "rounds")));
    return box;
  }
  const d = profile.derived;
  box.append(el("p", { className: "summary" },
    "First investment: " + roundLabel(d.first_investment) + " · Last round: " + roundLabel(d.last_round) +
    " · Follow-on: " + (d.follow_on === null ? "n/a" : d.follow_on ? "yes" : "no")));
  if (!d.first_investment) box.append(el("span", { className: "flag" }, "No Norte round recorded"));
  const table = el("table", { className: "rounds" },
    el("tr", {}, ...["Type", "Year", "Size (USD)", "Norte"].map((h) => el("th", { className: "label" }, h))));
  const sorted = [...rounds].sort((a, b) => Number(a.year) - Number(b.year));
  for (const r of sorted) {
    const ev = evidence(r);
    table.append(el("tr", { className: "main" },
      el("td", {}, r.type.replace(/_/g, " ")), el("td", {}, r.year),
      el("td", {}, el("span", { className: "val" + (ev.uncertain ? " uncertain" : "") }, usd(r.size_usd)), ...ev.nodes),
      el("td", {}, r.norte_participated === "TRUE" ? "yes" : "no")));
    const reported = r.reported_amount ? Number(r.reported_amount).toLocaleString("en-US") + " " + r.reported_currency : "amount not reported";
    table.append(el("tr", { className: "detail" }, el("td", { colSpan: 4 },
      reported + " · " + (r.co_investors || "no co-investors listed"), ev.note)));
  }
  box.append(table);
  return box;
}

function render(profile) {
  const main = $("profile");
  main.replaceChildren();
  $("name").textContent = profile.name;
  $("logo").replaceChildren(profile.logo ? el("img", { src: profile.logo, alt: profile.name }) : "no logo");
  const status = value(profile, "status");
  $("status").hidden = !status;
  $("status").textContent = status;
  document.title = profile.name + " – Company profile";

  if (!profile.researched_on) {
    main.append(el("div", { className: "banner" },
      "NOT RESEARCHED: this company has no researched_on date. Missing fields below are unchecked, not findings."));
  }

  const left = el("div", {}), right = el("div", {});
  left.append(el("div", { className: "label" }, "Short description"),
    el("p", { className: "short" }, fieldView(profile, "description", claim(profile, "description"))));

  const subRow = claim(profile, "sub_sector");
  const sector = subRow ? data.sectors[subRow.value] || "" : "";
  const facts = [
    ["Sub-sector and Sector", "sub_sector", subRow, subRow && [subRow.value, sector].filter(Boolean).join(" · ")],
    ["Status", "status"], ["Business model", "business_model"], ["Year founded", "year_founded"],
    ["HQ now", "hq"], ["HQ at first investment", "hq_at_first_investment"],
    ["Acquirer", "acquirer"], ["Acquisition year", "acquisition_year"],
  ];
  const dl = el("dl", { className: "facts" });
  for (const [label, field, row, text] of facts) {
    dl.append(el("dt", { className: "label" }, label),
      el("dd", {}, fieldView(profile, field, row || claim(profile, field), text)));
  }
  left.append(el("div", { className: "box" }, el("div", { className: "label" }, "Facts"), dl));

  left.append(el("div", { className: "box" }, el("div", { className: "label" }, "Long description"),
    el("p", {}, fieldView(profile, "long_description", claim(profile, "long_description")))));

  right.append(listBox(profile, "Founders", "founder"));
  right.append(roundsBox(profile));
  right.append(listBox(profile, "Markets", "market"), listBox(profile, "Accelerators", "accelerator"));
  main.append(el("div", { className: "cols" }, left, right));
}

function select(index) {
  const i = (index + profiles.length) % profiles.length;
  location.hash = encodeURIComponent(profiles[i].name);
}

function current() {
  const name = decodeURIComponent(location.hash.slice(1));
  const i = profiles.findIndex((p) => p.name === name);
  return i < 0 ? 0 : i;
}

function show() {
  const i = current();
  render(profiles[i]);
  $("search").value = "";
  $("search").placeholder = profiles[i].name;
}

if (!profiles.length) {
  $("profile").textContent = "No data. Run: python tools/profile-viewer/build_data.py";
} else {
  $("companies").append(...profiles.map((p) => el("option", { value: p.name })));
  $("search").addEventListener("change", () => {
    const i = profiles.findIndex((p) => p.name.toLowerCase() === $("search").value.trim().toLowerCase());
    if (i >= 0) select(i); else $("search").value = "";
  });
  $("prev").addEventListener("click", () => select(current() - 1));
  $("next").addEventListener("click", () => select(current() + 1));
  window.addEventListener("hashchange", show);
  show();
}
</script>
</body>
</html>
