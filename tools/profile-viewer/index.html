<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company profile</title>
<style>
  :root { --ink: #1c1c14; --paper: #f1f1ea; --muted: #6b6b5c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  header { display: flex; align-items: center; gap: 20px; padding: 20px 32px; border-bottom: 1px solid var(--ink); }
  .logo { width: 64px; height: 64px; border: 1px solid var(--ink); border-radius: 50%; display: flex;
    align-items: center; justify-content: center; overflow: hidden; background: #fff; flex: none;
    color: var(--muted); font-size: 11px; }
  .logo img { max-width: 80%; max-height: 80%; }
  h1 { margin: 0; font-size: 34px; }
  .tag { display: inline-block; border: 1px solid var(--ink); padding: 1px 8px; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; vertical-align: middle; margin-left: 10px; }
  .picker { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .picker input { font: inherit; padding: 6px 10px; border: 1px solid var(--ink); background: var(--paper); width: 260px; }
  .picker button { font: inherit; border: 1px solid var(--ink); background: var(--paper); padding: 6px 12px; cursor: pointer; }
  main { padding: 24px 32px; max-width: 1300px; }
  .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0 32px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .item { border: 1px solid var(--ink); padding: 6px 10px; background: #fff; }
  .rounds { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  .rounds th { text-align: left; font-weight: normal; }
  .rounds td, .rounds th { padding: 4px 8px 4px 0; }
  .rounds tr.main td { border-top: 1px solid var(--ink); padding-top: 8px; }
  .rounds tr.detail td { color: var(--muted); font-size: 12px; padding-bottom: 8px; }
  .summary { margin: 8px 0 0; font-size: 13px; }
  .flag { display: inline-block; margin-top: 8px; border: 1px solid #b42318; color: #b42318; background: #fdeceb;
    padding: 2px 8px; font-size: 12px; font-weight: 600; }
  .short .badge, .short .src, .short .srcpanel { font-family: system-ui, sans-serif; font-style: normal; }
  .short { font: italic 24px/1.35 Georgia, serif; margin: 6px 0 24px; }
  .box { border: 1px solid var(--ink); padding: 14px 16px; margin-bottom: 24px; }
  .facts { display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; margin: 8px 0 0; }
  .facts dt { align-self: center; }
  .facts dd { margin: 0; }
  .empty { color: var(--muted); }
  .val { display: inline-block; padding: 2px 8px; border: 1px solid transparent; }
  .val.uncertain { border: 1px dashed #d4bf94; background: #f7f2e6; }
  .val.notfound { border: 1px solid #b42318; color: #b42318; background: #fdeceb; }
  .val.notresearched { border: 2px solid #b42318; color: #b42318; background: transparent; }
  .badge { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 0 6px; margin-left: 6px; border: 1px solid var(--muted); color: var(--muted); vertical-align: middle; }
  .badge.est, .badge.low { border-color: #d4bf94; color: #85703f; background: #f7f2e6; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
  .dot.high { background: #2f9e44; } .dot.medium { background: #e6b800; } .dot.low { background: #d92d20; }
  .src { font: inherit; font-size: 11px; margin-left: 6px; padding: 0 6px; border: 1px solid var(--ink);
    background: var(--paper); cursor: pointer; vertical-align: middle; }
  .srcpanel { display: inline-flex; gap: 6px; align-items: center; margin-left: 6px; font-size: 12px; color: var(--muted); }
  .srcpanel[hidden] { display: none; }
  .srcpanel button { font: inherit; font-size: 11px; border: 1px solid var(--ink); background: #fff; padding: 0 6px; cursor: pointer; }
  .note { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .banner { border: 2px solid #b42318; color: #b42318; padding: 10px 16px; margin-bottom: 24px; font-weight: 600; }
  .timeline { margin-top: 8px; border-left: 2px solid var(--ink); padding-left: 0; }
  .tl-year { font: 700 20px/1 Georgia, serif; margin: 16px 0 6px -2px; padding-left: 14px; border-left: 2px solid var(--ink); }
  .tl-year:first-child { margin-top: 0; }
  .tl-item { position: relative; margin: 0 0 16px 14px; padding: 8px 12px; display: grid; grid-template-columns: 84px 1fr; gap: 0 10px; }
  .tl-item::before { content: ""; position: absolute; left: -20px; top: 16px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--ink); }
  .tl-item .when { font-size: 12px; color: var(--muted); padding-top: 2px; }
  .tl-item.round { background: #e6e6db; border-left: 3px solid var(--ink); }
  .tl-item.round::before { border-radius: 0; background: var(--ink); }
  .tl-item.round .when { font-weight: 600; color: var(--ink); }
  .legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .legend .badge { margin-left: 0; }
  header .legend { flex-basis: 100%; }
  header { flex-wrap: wrap; }
  .completeness { font-size: 13px; margin-top: 4px; }
  .completeness b { font-weight: 600; }
  .completeness.unresearched { color: #b42318; font-weight: 600; }
  .banner.check ul { margin: 6px 0 0; padding-left: 20px; font-weight: 400; }
  details.howto { margin-top: 4px; font-size: 12px; }
  details.howto summary { cursor: pointer; color: var(--muted); }
  details.howto pre { margin: 6px 0; padding: 6px 8px; background: #fff; border: 1px solid var(--ink);
    white-space: pre-wrap; word-break: break-all; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  details.howto button { font: inherit; font-size: 11px; border: 1px solid var(--ink); background: var(--paper); padding: 0 6px; cursor: pointer; }
  details.howto ul { margin: 4px 0; padding-left: 18px; }
  .record { grid-template-columns: 160px 1fr; }
  .record dd { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <div><h1><span id="name"></span><span class="tag" id="status" hidden></span></h1>
    <div class="completeness" id="completeness"></div></div>
  <div class="picker">
    <button id="prev" title="Previous company">&larr;</button>
    <input id="search" list="companies" placeholder="Search companies..." autocomplete="off">
    <datalist id="companies"></datalist>
    <button id="next" title="Next company">&rarr;</button>
  </div>
  <div class="legend">
    <span><span class="dot high" style="margin:0"></span> high</span>
    <span><span class="dot medium" style="margin:0"></span> medium</span>
    <span><span class="dot low" style="margin:0"></span> low confidence</span>
    <span><span class="val uncertain" style="padding:0 6px">value</span> uncertain: estimated or low</span>
    <span><span class="badge">reported</span> a Source states it</span>
    <span><span class="badge est">EST</span> estimated (we deduced it)</span>
    <span><span class="badge low">LOW</span> low confidence</span>
    <span><span class="val notfound" style="padding:0 6px">NOT FOUND</span> researched, nothing public</span>
    <span><span class="val notresearched" style="padding:0 6px">NOT RESEARCHED</span> not yet researched</span>
  </div>
</header>
<main id="profile"></main>
<script src="data.js"></script>
<script>
const data = window.PROFILE_DATA;
const profiles = data ? data.profiles : [];
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function claim(profile, field) {
  return profile.claims.find((row) => row.field === field);
}

function value(profile, field) {
  const c = claim(profile, field);
  return c ? c.value : "";
}

function copyText(text, button) {
  const done = () => { const old = button.textContent; button.textContent = "Copied"; setTimeout(() => (button.textContent = old), 1200); };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(done, () => { button.textContent = "Copy failed"; });
  else { const t = el("textarea", { value: text }); document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); done(); }
}

// Source button: reveals Open (new tab) and Copy; the URL itself is never printed.
function sourceButton(url) {
  if (!url) return document.createDocumentFragment();
  const wrap = el("span", {});
  const btn = el("button", { className: "src", type: "button", title: "Show source" }, "source");
  const panel = el("span", { className: "srcpanel", hidden: true },
    el("button", { type: "button", onclick: () => /^https?:\/\//i.test(url) && window.open(url, "_blank", "noopener") }, "Open"),
    el("button", { type: "button", onclick: (e) => copyText(url, e.target) }, "Copy"));
  btn.addEventListener("click", () => { panel.hidden = !panel.hidden; });
  wrap.append(btn, panel);
  return wrap;
}

// Evidence shown on any row-backed value: confidence dot, Basis, note, source button.
function evidence(row) {
  const uncertain = row.basis === "estimated" || row.confidence === "low";
  const out = [];
  if (row.confidence) out.push(el("span", { className: "dot " + row.confidence, title: row.confidence + " confidence" }));
  out.push(el("span", { className: "badge" }, row.basis || "no basis"));
  if (row.basis === "estimated") out.push(el("span", { className: "badge est" }, "EST"));
  if (row.confidence === "low") out.push(el("span", { className: "badge low" }, "LOW"));
  out.push(sourceButton(row.source_url));
  const note = row.note ? el("span", { className: "note" }, row.note) : "";
  return { uncertain, nodes: out, note };
}

const valueSpan = (ev, text) => el("span", { className: "val" + (ev.uncertain ? " uncertain" : "") }, text);
const typeLabel = (type) => type.replace(/_/g, " ");

const NONE_RECORDED = new Set(["acquirer", "acquisition_year"]);


const csvCell = (v) => (/[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v);

const CLAIM_COLUMNS_HELP = "source_url: one valid http(s) link · basis: reported (a Source states it) or estimated (note says why) · " +
  "confidence: high, medium or low · values stay on one line";

// What each claim field expects (docs/data-model.md); allowed values come from build_data.py / sectors.csv.
function fieldHelp(field) {
  const a = data.allowed || {};
  const subs = Object.keys(data.sectors || {});
  const help = {
    description: ["One or two sentences on what the company does, in our own words."],
    long_description: ["One paragraph on product, customers and business model, from one Source."],
    sub_sector: ["Must already be listed in sectors.csv (add it there first if new). Listed: " + (subs.join("; ") || "none yet")],
    hq: ["City, Country (country name in English). Where the company says its HQ is, never legal incorporation."],
    hq_at_first_investment: ["City, Country, as HQ when Norte first invested."],
    year_founded: ["A four-digit year, such as 2019."],
    status: ["One of: " + (a.status || []).join(", ") + ". stealth = operating, not launched; active = activity in the last ~18 months " +
      "(usually estimated); inactive = no recent activity, no confirmed shutdown (estimated, low or medium); closed = a Source confirms shutdown (reported)."],
    business_model: ["One of: " + (a.business_models || []).join(", ") + "."],
    acquirer: ["Who acquired the company. Leave out if it was not acquired."],
    acquisition_year: ["A four-digit year, not before year_founded. Leave out if not acquired."],
    founder: ["One Founder's name per row."],
    market: ["One country per row where the company operates or sells (English name)."],
    accelerator: ["One programme per row, such as Y Combinator (batch goes in the note)."],
    milestone: ["date: event. The date is 2021, 2021-03 or 2021-03-19. Non-funding events only (launches, pivots, offices, HQ moves); Rounds go in rounds.csv."],
  };
  return help[field] || [];
}

// Collapsed "How to add this": a pre-filled CSV line with a copy button plus the expected format.
function howTo(file, line, lines) {
  const pre = el("pre", {}, line);
  return el("details", { className: "howto" }, el("summary", {}, "How to add this"),
    el("div", {}, "Add this line to data/" + file + ", then fill in the empty values: ",
      el("button", { type: "button", onclick: (e) => copyText(line, e.target) }, "Copy")),
    pre, el("ul", {}, ...lines.map((t) => el("li", {}, t))));
}

function claimTemplate(profile, field) {
  const line = [profile.name, field, "", "", "", "", ""].map(csvCell).join(",");
  return howTo("claims.csv", line, [...fieldHelp(field), CLAIM_COLUMNS_HELP,
    "Columns: company, field, value, source_url, basis, confidence, note"]);
}

function roundTemplate(profile) {
  const a = data.allowed || {};
  const line = [profile.name, "", "", "", "", "", "", "", "", "", "", ""].map(csvCell).join(",");
  return howTo("rounds.csv", line, [
    "Columns: company, year, type, reported_amount, reported_currency, size_usd, co_investors, norte_participated, source_url, basis, confidence, note",
    "type: " + (a.round_types || []).join(", ") + " (extensions and bridges take their base type; debt never counts as the last Round)",
    "reported_amount and reported_currency: the total size as the Source reports it, a whole number and a code such as BRL; size_usd is that in whole US dollars at the fx.csv rate (leave all three empty if undisclosed)",
    "co_investors: everyone but Norte, separated by '; ', with (lead) or (co-lead) after the name",
    "norte_participated: TRUE, FALSE or UNKNOWN",
    "One row per Round: same company, year and type is rejected",
    "source_url, basis (reported or estimated), confidence (high, medium, low) and one-line rules as for claims",
  ]);
}

// One classification for every field slot: reported / uncertain / not found / not researched.
function fieldView(profile, field, row, text) {
  if (row) {
    const ev = evidence(row);
    return el("span", {}, valueSpan(ev, text ?? row.value), ...ev.nodes, ev.note);
  }
  const gap = (node) => el("span", {}, node, field === "rounds" ? roundTemplate(profile) : claimTemplate(profile, field));
  if (NONE_RECORDED.has(field)) return gap(el("span", { className: "val empty" }, "none recorded (not acquired, or not found)"));
  if (profile.researched_on) {
    return gap(el("span", { className: "val notfound" }, "NOT FOUND (as of " + profile.researched_on + ")"));
  }
  return gap(el("span", { className: "val notresearched" }, "NOT RESEARCHED"));
}

// Slots counted: the 8 single-value fields (acquirer and acquisition_year excluded, as they are
// often legitimately absent), the 4 list fields (filled if one row) and Rounds. Denominator: 13.
const COUNTED_FIELDS = ["description", "long_description", "sub_sector", "hq", "hq_at_first_investment",
  "year_founded", "status", "business_model", "founder", "market", "accelerator", "milestone"];

function completeness(profile) {
  if (!profile.researched_on) return "not researched";
  const slots = COUNTED_FIELDS.map((f) => profile.claims.filter((r) => r.field === f))
    .concat([profile.rounds]);
  const filled = slots.filter((rows) => rows.length).length;
  // uncertain values count as filled; a slot is uncertain if every row in it is estimated or low
  const uncertain = slots.filter((rows) => rows.length &&
    rows.every((r) => r.basis === "estimated" || r.confidence === "low")).length;
  return filled + " / " + slots.length + " filled, " + uncertain + " uncertain, " + (slots.length - filled) + " not found";
}

function listBox(profile, title, field) {
  const rows = profile.claims.filter((r) => r.field === field);
  const stack = el("div", { className: "stack" });
  if (rows.length) {
    for (const row of rows) stack.append(el("div", { className: "item" }, fieldView(profile, field, row)));
  } else {
    stack.append(fieldView(profile, field));
  }
  return el("div", { className: "box" }, el("div", { className: "label" }, title), stack);
}

const usd = (n) => (n === "" || n == null ? "?" : "US$" + Number(n).toLocaleString("en-US"));
const roundLabel = (r) => (r ? typeLabel(r.type) + " " + r.year : "none");

function roundsBox(profile) {
  const box = el("div", { className: "box" }, el("div", { className: "label" }, "Investment Rounds"));
  const rounds = profile.rounds;
  if (!rounds.length) {
    box.append(el("div", { className: "stack" }, fieldView(profile, "rounds")));
    return box;
  }
  const d = profile.derived;
  box.append(el("p", { className: "summary" },
    "First investment: " + roundLabel(d.first_investment) + " · Last round: " + roundLabel(d.last_round) +
    " · Follow-on: " + (d.follow_on === null ? "n/a" : d.follow_on ? "yes" : "no")));
  if (!d.first_investment) box.append(el("span", { className: "flag" }, "No Norte round recorded"));
  const table = el("table", { className: "rounds" },
    el("tr", {}, ...["Type", "Year", "Size (USD)", "Norte"].map((h) => el("th", { className: "label" }, h))));
  for (const r of rounds) { // already in year, then stage order (build_data.py)
    const ev = evidence(r);
    table.append(el("tr", { className: "main" },
      el("td", {}, typeLabel(r.type)), el("td", {}, r.year),
      el("td", {}, valueSpan(ev, usd(r.size_usd)), ...ev.nodes),
      el("td", {}, r.norte_participated === "TRUE" ? "yes" : r.norte_participated === "FALSE" ? "no" : "unknown")));
    const reported = r.reported_amount ? [Number(r.reported_amount).toLocaleString("en-US"), r.reported_currency].filter(Boolean).join(" ") : "amount not reported";
    table.append(el("tr", { className: "detail" }, el("td", { colSpan: 4 },
      reported + " · " + (r.co_investors || "no co-investors listed"), ev.note)));
  }
  box.append(table);
  return box;
}

// Milestone value is "date: event"; the date is 2021, 2021-03 or 2021-03-19.
function parseMilestone(row) {
  const m = /^(\d{4}(?:-\d{2}(?:-\d{2})?)?):\s*([\s\S]*)$/.exec(row.value);
  return m ? { date: m[1], text: m[2] } : { date: "", text: row.value };
}

// Within a year, dated items (month or day) come before year-only items; Rounds are year-only.
function timelineEntries(profile) {
  const entries = [];
  for (const row of profile.claims.filter((r) => r.field === "milestone")) {
    const { date, text } = parseMilestone(row);
    entries.push({ kind: "milestone", year: date.slice(0, 4), date, text, row });
  }
  for (const row of profile.rounds) entries.push({ kind: "round", year: row.year, date: row.year, row });
  const rank = (e) => (e.kind === "round" ? 2 : e.date.length > 4 ? 0 : 1);
  return entries
    .map((e, i) => ({ e, i }))
    .sort((a, b) => (a.e.year || "9999").localeCompare(b.e.year || "9999") ||
      rank(a.e) - rank(b.e) || a.e.date.localeCompare(b.e.date) || a.i - b.i)
    .map((x) => x.e);
}

function timelineBox(profile) {
  const box = el("div", { className: "box" }, el("div", { className: "label" }, "History"));
  const entries = timelineEntries(profile);
  if (!entries.length) {
    box.append(el("div", { className: "stack" }, fieldView(profile, "milestone")));
    return box;
  }
  const line = el("div", { className: "timeline" });
  let year = null;
  for (const e of entries) {
    if (e.year !== year) {
      year = e.year;
      line.append(el("div", { className: "tl-year" }, year || "Undated"));
    }
    const ev = evidence(e.row);
    if (e.kind === "round") {
      const label = "Round: " + typeLabel(e.row.type) + (e.row.size_usd ? " · " + usd(e.row.size_usd) : "");
      line.append(el("div", { className: "tl-item round" }, el("span", { className: "when" }, "Round"),
        el("span", {}, valueSpan(ev, label), ...ev.nodes, ev.note)));
    } else {
      line.append(el("div", { className: "tl-item milestone" }, el("span", { className: "when" }, e.date || "no date"),
        el("span", {}, valueSpan(ev, e.text), ...ev.nodes, ev.note)));
    }
  }
  box.append(line);
  return box;
}


// Every company-level column from companies.csv, with a placeholder when empty.
function recordBox(profile) {
  const r = profile.record || {};
  const none = (t) => el("span", { className: "val empty" }, t);
  const plain = (v, t) => (v ? v : none(t));
  const link = (url) => (url ? el("span", {}, /^https?:\/\//i.test(url) ? el("a", { href: url, target: "_blank", rel: "noopener" }, url) : url) : none("not set"));
  const flag = (v) => (v === "TRUE" ? "yes" : v === "FALSE" ? "no" : none("not set"));
  const rows = [
    ["Website", link(r.website)], ["Fund", plain(r.fund, "not set")],
    ["Highlight", flag(r.is_highlight)], ["Exit", flag(r.is_exit)],
    ["Logo", plain(r.logo, "no logo") ], ["Logo origin", plain(r.logo_origin, "not set")],
    ["Logo source", link(r.logo_source)],
    ["Researched on", profile.researched_on || el("span", { className: "val notresearched" }, "NOT RESEARCHED")],
  ];
  const dl = el("dl", { className: "facts record" });
  for (const [label, node] of rows) dl.append(el("dt", { className: "label" }, label), el("dd", {}, node));
  return el("div", { className: "box" }, el("div", { className: "label" }, "Record details"), dl);
}

function render(profile) {
  const main = $("profile");
  main.replaceChildren();
  $("name").textContent = profile.name;
  $("logo").replaceChildren(profile.logo ? el("img", { src: profile.logo, alt: profile.name }) : "no logo");
  const status = value(profile, "status");
  $("status").hidden = !status;
  $("status").textContent = status;
  document.title = profile.name + " – Company profile";
  const comp = $("completeness");
  comp.textContent = completeness(profile);
  comp.className = "completeness" + (profile.researched_on ? "" : " unresearched");

  const errors = (profile.check_errors || []).concat(data.check_general || []);
  if (errors.length) {
    main.append(el("div", { className: "banner check" }, "Data check: " + errors.length + " problem(s)",
      el("ul", {}, ...errors.map((e) => el("li", {}, e)))));
  }

  if (!profile.researched_on) {
    main.append(el("div", { className: "banner" },
      "NOT RESEARCHED: this company has no researched_on date. Missing fields below are unchecked, not findings."));
  }

  const left = el("div", {}), right = el("div", {});
  left.append(el("div", { className: "label" }, "Short description"),
    el("p", { className: "short" }, fieldView(profile, "description", claim(profile, "description"))));

  const subRow = claim(profile, "sub_sector");
  const sector = subRow ? data.sectors[subRow.value] || "" : "";
  const facts = [
    ["Sub-sector and Sector", "sub_sector", subRow, subRow && [subRow.value, sector].filter(Boolean).join(" · ")],
    ["Status", "status"], ["Business model", "business_model"], ["Year founded", "year_founded"],
    ["HQ now", "hq"], ["HQ at first investment", "hq_at_first_investment"],
    ["Acquirer", "acquirer"], ["Acquisition year", "acquisition_year"],
  ];
  const dl = el("dl", { className: "facts" });
  for (const [label, field, row, text] of facts) {
    dl.append(el("dt", { className: "label" }, label),
      el("dd", {}, fieldView(profile, field, row || claim(profile, field), text)));
  }
  left.append(el("div", { className: "box" }, el("div", { className: "label" }, "Facts"), dl));

  left.append(el("div", { className: "box" }, el("div", { className: "label" }, "Long description"),
    el("p", {}, fieldView(profile, "long_description", claim(profile, "long_description")))));

  left.append(timelineBox(profile));
  left.append(recordBox(profile));

  right.append(listBox(profile, "Founders", "founder"));
  right.append(roundsBox(profile));
  right.append(listBox(profile, "Markets", "market"), listBox(profile, "Accelerators", "accelerator"));
  main.append(el("div", { className: "cols" }, left, right));
}

function select(index) {
  const i = (index + profiles.length) % profiles.length;
  location.hash = encodeURIComponent(profiles[i].name);
}

function current() {
  let name = "";
  try { name = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* malformed hash: fall back to the first company */ }
  const i = profiles.findIndex((p) => p.name === name);
  return i < 0 ? 0 : i;
}

function show() {
  const i = current();
  const wanted = "#" + encodeURIComponent(profiles[i].name);
  if (location.hash !== wanted) history.replaceState(null, "", wanted); // keep the address true to what is shown
  render(profiles[i]);
  $("search").value = "";
  $("search").placeholder = profiles[i].name;
}

if (!profiles.length) {
  $("profile").textContent = "No data. Run: python tools/profile-viewer/build_data.py";
} else {
  $("companies").append(...profiles.map((p) => el("option", { value: p.name })));
  $("search").addEventListener("change", () => {
    const q = $("search").value.trim().toLowerCase();
    let i = profiles.findIndex((p) => p.name.toLowerCase() === q);
    if (i < 0) { // a unique partial match also selects
      const hits = profiles.filter((p) => q && p.name.toLowerCase().includes(q));
      if (hits.length === 1) i = profiles.indexOf(hits[0]);
    }
    if (i >= 0) select(i); else $("search").value = "";
  });
  $("prev").addEventListener("click", () => select(current() - 1));
  $("next").addEventListener("click", () => select(current() + 1));
  window.addEventListener("hashchange", show);
  show();
}
</script>
</body>
</html>
